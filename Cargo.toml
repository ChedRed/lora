[package]
name = "lora"
authors = ["Ryan Chou"]
description = "A simple Lua framework for making complex games!"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
# homepage = "ched.red"
repository = "https://github.com/ChedRed/lora"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.6.2", features = ["derive"] }
colored = "3.1.1"
crossbeam = "0.8.4"
glyphon = "0.12.0"
image = "0.25.10"
jsonschema = "0.49.2"
pollster = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "30.0.0"
winit = "0.30.13"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4.45"
mlua = { version = "0.12.0", features = ["luajit52", "send", "vendored"] }
rodio = "0.22.2"
rapier2d = { version="0.34.0", features = ["parallel"] }
# native section ends

# wasm32 section begins
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", features = ["wasmbind"] }
mlua = { version = "0.12.0", features = ["lua54", "send", "vendored"] }
rapier2d = "0.34.0"
web-sys = "0.3.105"

[target.wasm32-unknown-unknown]
rustflags = ["-Ctarget-feature=+atomics,+bulk-memory"]
